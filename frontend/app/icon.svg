<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sphereGrad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
    </radialGradient>
    <filter id="lineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="20" cy="20" r="17.5" />
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="20" cy="20" r="18.5" stroke="#2e3828" stroke-width="1" fill="none" />

  <!-- Badge background -->
  <circle cx="20" cy="20" r="17.5" fill="#1e2419" />

  <!-- Radial glow -->
  <circle cx="20" cy="20" r="17.5" fill="url(#sphereGrad)" />

  <!-- Orbit ellipse horizontal -->
  <ellipse cx="20" cy="20" rx="13" ry="5.5" stroke="#2e3828" stroke-width="0.9" fill="none" stroke-dasharray="2.5 1.8" />

  <!-- Orbit ellipse tilted -->
  <ellipse cx="20" cy="20" rx="13" ry="5.5" stroke="#2e3828" stroke-width="0.9" fill="none" stroke-dasharray="2.5 1.8" transform="rotate(-50 20 20)" />

  <!-- Grid lines -->
  <g clip-path="url(#circleClip)" opacity="0.18">
    <line x1="2.5" y1="20" x2="37.5" y2="20" stroke="#4ade80" stroke-width="0.4" />
    <line x1="20" y1="2.5" x2="20" y2="37.5" stroke="#4ade80" stroke-width="0.4" />
  </g>

  <!-- Trend line glow -->
  <polyline points="8,27 13,22 17,25 22,16 27,18 32,10" fill="none" stroke="#4ade80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#lineGlow)" clip-path="url(#circleClip)" />

  <!-- Trend line crisp -->
  <polyline points="8,27 13,22 17,25 22,16 27,18 32,10" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#circleClip)" />

  <!-- Area fill -->
  <polygon points="8,27 13,22 17,25 22,16 27,18 32,10 32,37.5 8,37.5" fill="#4ade80" opacity="0.055" clip-path="url(#circleClip)" />

  <!-- Data point dots -->
  <circle cx="8"  cy="27" r="1.1" fill="#1e2419" stroke="#4ade80" stroke-width="1" clip-path="url(#circleClip)" />
  <circle cx="13" cy="22" r="1.1" fill="#1e2419" stroke="#4ade80" stroke-width="1" clip-path="url(#circleClip)" />
  <circle cx="17" cy="25" r="1.1" fill="#1e2419" stroke="#4ade80" stroke-width="1" clip-path="url(#circleClip)" />
  <circle cx="22" cy="16" r="1.1" fill="#1e2419" stroke="#4ade80" stroke-width="1" clip-path="url(#circleClip)" />
  <circle cx="27" cy="18" r="1.1" fill="#1e2419" stroke="#4ade80" stroke-width="1" clip-path="url(#circleClip)" />

  <!-- Terminal dot -->
  <circle cx="32" cy="10" r="2"   fill="#4ade80" opacity="0.25" clip-path="url(#circleClip)" />
  <circle cx="32" cy="10" r="1.4" fill="#4ade80" clip-path="url(#circleClip)" />

  <!-- Inner accent ring -->
  <circle cx="20" cy="20" r="17.5" fill="none" stroke="#4ade80" stroke-width="0.6" opacity="0.18" />
</svg>
