# ─────────────────────────────────────────────────────────────────────────────
# CD – Deploy to Production + Auto-tag + GitHub Release
#
# Triggers on every push to `main`.
# Typical sources:
#   • staging   → main  (scheduled release)
#   • hotfix/*  → main  (emergency fix)
#
# Pipeline:
#   1. CI Gate       – full lint / type-check / test / build
#   2. Deploy        – frontend (Vercel prod) + backend (AWS ECS prod) in parallel
#   3. Tag & Release – bump semver tag from conventional commits + create release
#
# GitHub Environment: production
#   • Requires at least 1 reviewer before deployment begins
#   • Store production-tier secrets here
#
# Semver bump rules (conventional commits):
#   feat!: / BREAKING CHANGE  → major  (x.0.0)
#   feat:                     → minor  (0.x.0)
#   fix: / chore: / others    → patch  (0.0.x)
# ─────────────────────────────────────────────────────────────────────────────
name: CD – Deploy to Production

on:
  push:
    branches:
      - main

# Queue; never cancel an in-flight production deployment
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # Needed for tagging and creating GitHub releases

jobs:
  # ── Gate: full CI must pass before anything is deployed ──────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      node-version: '20'
      run-all: true

  # ── Deploy frontend to Vercel (production slot) ───────────────────────────
  deploy-frontend:
    name: Deploy Frontend → production
    needs: ci
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: production
      production-deploy: true # --prod flag → Vercel production URL
    secrets: inherit

  # ── Deploy backend to AWS ECS (production cluster) ────────────────────────
  deploy-backend:
    name: Deploy Backend → production
    needs: ci
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: production
    secrets: inherit

  # ── Semantic versioning + GitHub release ─────────────────────────────────
  # Runs only after both services are successfully deployed, ensuring the
  # tag always points to a known-good production state.
  tag-and-release:
    name: 🏷  Tag & GitHub Release
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    environment: production

    # Prevent double-tagging if somehow the workflow is triggered twice on the
    # same SHA (e.g. forced re-run)
    concurrency:
      group: tag-release-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required for semantic-version tag calculation
          fetch-depth: 0

      # Bumps version based on conventional commit messages since last tag.
      # Outputs: new_tag (e.g. v1.4.2), changelog (markdown), previous_tag
      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Map conventional commit types to semver bumps
          major_string_token: 'BREAKING CHANGE,feat!'
          minor_string_token: 'feat'
          patch_string_token: 'fix,chore,refactor,perf,docs,style,test,build,ci'
          # Do not push a tag when there are no releasable commits
          # (tag_prefix defaults to "v")
          dry_run: false

      # Only create a GitHub release if the tag action actually produced a new tag
      - name: Create GitHub release
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: 'Release ${{ steps.tag.outputs.new_tag }}'
          body: ${{ steps.tag.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false # We use the changelog from the tag action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize release
        if: ${{ steps.tag.outputs.new_tag != '' }}
        run: |
          echo "## Production Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ steps.tag.outputs.new_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Previous** | \`${{ steps.tag.outputs.previous_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
