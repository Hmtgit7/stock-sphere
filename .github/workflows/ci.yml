# ─────────────────────────────────────────────────────────────────────────────
# CI – Pull Request Status Checks
#
# Triggers on every PR opened/updated/reopened that targets:
#   develop  →  integration branch
#   staging  →  release candidate
#   main     →  production
#
# Required status checks to configure in branch protection:
#   ci / ci-frontend  (if frontend changed)
#   ci / ci-backend   (if backend changed)
# ─────────────────────────────────────────────────────────────────────────────
name: CI – Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types: [opened, synchronize, reopened]

# Cancel in-flight CI for the same PR when a new commit is pushed
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      node-version: "20"
      run-all: false   # Only test packages whose files changed

      - name: Build
        run: pnpm build
